name: macOS test

# Builds the VI-Suite HBC extension for macOS arm64 (Apple Silicon), installs it
# into Blender and runs:
#   - tests/smoke_test.py      add-on enable, imports, EnergyPlus/Radiance start
#                              (incl. EnergyPlus without DYLD_LIBRARY_PATH, i.e. rpath fix B)
#   - tests/envi_blend_test.py EnVi export + EnergyPlus run with tests/data/simple_cube.blend

# Runs on pushes to hbc_downstream and on PRs into it (not twice for a PR branch),
# skips changes that only touch documentation, and can be started by hand
# (Actions -> macOS test -> Run workflow), optionally uploading the extension zip.
on:
  push:
    branches: [hbc_downstream]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "Licenses/**"
  pull_request:
    branches: [hbc_downstream]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "Licenses/**"
  workflow_dispatch:
    inputs:
      blender_version:
        description: Blender version
        default: "5.1.2"
      upload_zip:
        description: Upload the built extension zip as artifact
        type: boolean
        default: false
  # used by release.yml
  workflow_call:
    inputs:
      blender_version:
        type: string
        default: "5.1.2"
      upload_zip:
        type: boolean
        default: false

jobs:
  macos-arm64:
    runs-on: macos-latest   # Apple Silicon
    timeout-minutes: 60
    env:
      BLENDER_VERSION: ${{ inputs.blender_version || '5.1.2' }}
      REPORTS: ${{ github.workspace }}/ci-reports

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: System info
        run: |
          sw_vers
          uname -m
          mkdir -p "$REPORTS"

      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/blender.dmg
          key: blender-${{ env.BLENDER_VERSION }}-macos-arm64

      - name: Download Blender
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          series="${BLENDER_VERSION%.*}"
          curl -fL --retry 3 -o "$RUNNER_TEMP/blender.dmg" \
            "https://download.blender.org/release/Blender${series}/blender-${BLENDER_VERSION}-macos-arm64.dmg"

      - name: Install Blender
        run: |
          hdiutil attach -nobrowse -readonly -mountpoint /Volumes/Blender "$RUNNER_TEMP/blender.dmg"
          cp -R /Volumes/Blender/Blender.app "$RUNNER_TEMP/"
          hdiutil detach /Volumes/Blender
          echo "BLENDER=$RUNNER_TEMP/Blender.app/Contents/MacOS/Blender" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/Blender.app/Contents/MacOS/Blender" --version

      - name: Cache wheels
        uses: actions/cache@v4
        with:
          path: |
            wheels
            ngsolve_wheels
            pyroomacoustics_wheels
          key: wheels-macos-arm64-${{ hashFiles('blender_manifest.toml') }}

      - name: Prepare macOS arm64 build (filter manifest, download wheels)
        run: python build_scripts/ci_prepare_platform.py --platform macos-arm64 2>&1 | tee "$REPORTS/prepare.log"

      - name: Build extension
        run: |
          mkdir -p dist
          "$BLENDER" --command extension build --source-dir . \
            --output-filepath dist/vi-suite_HBC-macos-arm64.zip 2>&1 | tee "$REPORTS/build.log"
          ls -lh dist

      - name: Install extension
        run: |
          "$BLENDER" --command extension install-file --repo user_default --enable \
            dist/vi-suite_HBC-macos-arm64.zip 2>&1 | tee "$REPORTS/install.log"

      - name: Mark installed programs as quarantined (simulate browser download)
        run: |
          ext="$HOME/Library/Application Support/Blender/${BLENDER_VERSION%.*}/extensions/user_default/vi_suite_HBC"
          for d in EPFiles/darwin RadFiles/darwin OFFiles/darwin; do
            [ -d "$ext/$d" ] && find "$ext/$d" -type f -exec xattr -w com.apple.quarantine "0081;00000000;Safari;" {} +
          done
          xattr -l "$ext/EPFiles/darwin/energyplus-25.1.0"

      - name: Smoke test
        run: |
          "$BLENDER" -b --python-exit-code 1 --python tests/smoke_test.py -- \
            --report "$REPORTS/smoke-report.json" 2>&1 | tee "$REPORTS/smoke.log"
          exit ${PIPESTATUS[0]}

      - name: EnVi test with simple_cube.blend
        if: success() || failure()
        run: |
          work="$RUNNER_TEMP/envi"
          mkdir -p "$work"
          cp tests/data/simple_cube.blend "$work/"
          set +e
          "$BLENDER" -b "$work/simple_cube.blend" --python-exit-code 1 --python tests/envi_blend_test.py -- \
            --report "$REPORTS/envi-report.json" 2>&1 | tee "$REPORTS/envi.log"
          rc=${PIPESTATUS[0]}
          mkdir -p "$REPORTS/envi-output"
          cp "$work"/simple_cube/in*.idf "$work"/simple_cube/*out.err "$REPORTS/envi-output/" 2>/dev/null
          exit $rc

      - name: Summary
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          rep = os.environ["REPORTS"]
          for name in ("smoke-report.json", "envi-report.json"):
              p = os.path.join(rep, name)
              print(f"### {name}\n")
              if not os.path.isfile(p):
                  print("not written\n"); continue
              print("| status | check | detail |\n|---|---|---|")
              for r in json.load(open(p)):
                  d = r["detail"].replace("|", "/").replace("\n", " ")[:300]
                  print(f"| {r['status']} | {r['check']} | {d} |")
              print()
          EOF

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-reports
          path: ci-reports
          retention-days: 14

      - name: Upload extension zip
        if: inputs.upload_zip
        uses: actions/upload-artifact@v4
        with:
          name: vi-suite_HBC-macos-arm64-extension
          path: dist/*.zip
          retention-days: 7
