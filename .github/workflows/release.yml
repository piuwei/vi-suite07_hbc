name: Release

# Builds the extension for all platforms (Linux is built and tested by the Linux
# test workflow, macOS and Windows are only built, on Ubuntu) and, for a version tag, publishes a GitHub release
# with one zip per platform.
#
#   git tag v0.0.5 && git push origin v0.0.5
#
# The tag must match `version` in blender_manifest.toml (v0.0.5 <-> "0.0.5").
# A manual start (Actions -> Release -> Run workflow) only builds and tests and
# uploads the zips as workflow artifacts, without creating a release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      blender_version:
        description: Blender version
        default: "5.3.0"

jobs:
  check-version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version from manifest (and compare with tag)
        id: version
        run: |
          version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' blender_manifest.toml)"
          echo "manifest version: $version"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest version ${version} (expected v${version})"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    needs: check-version
    uses: ./.github/workflows/linux.yml
    with:
      blender_version: ${{ inputs.blender_version || '5.3.0' }}
      upload_zip: true

  # macOS and Windows zips are only built here (on Ubuntu, because GitHub offers few
  # macOS runners) and not tested: the build is just wheel download + `extension build`.
  # The tests for these platforms are in the macOS/Windows test workflows (by hand or
  # with the full-ci label).
  build-cross:
    name: ${{ matrix.platform }} build (not tested)
    needs: check-version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-arm64, windows-x64]
    env:
      BLENDER_VERSION: ${{ inputs.blender_version || '5.3.0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/blender.tar.xz
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download Blender
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          series="${BLENDER_VERSION%.*}"
          curl -fL --retry 3 -o "$RUNNER_TEMP/blender.tar.xz" \
            "https://download.blender.org/release/Blender${series}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"

      - name: Install Blender
        run: |
          tar -xf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
          echo "BLENDER=$RUNNER_TEMP/blender-${BLENDER_VERSION}-linux-x64/blender" >> "$GITHUB_ENV"

      - name: Cache wheels
        uses: actions/cache@v4
        with:
          path: |
            wheels
            ngsolve_wheels
          key: wheels-${{ matrix.platform }}-${{ hashFiles('blender_manifest.toml') }}

      - name: Prepare ${{ matrix.platform }} build (filter manifest, download wheels)
        run: python build_scripts/ci_prepare_platform.py --platform ${{ matrix.platform }}

      - name: Build extension
        run: |
          mkdir -p dist
          "$BLENDER" --command extension build --source-dir . \
            --output-filepath dist/vi-suite_HBC-${{ matrix.platform }}.zip
          ls -lh dist

      - name: Upload extension zip
        uses: actions/upload-artifact@v4
        with:
          name: vi-suite_HBC-${{ matrix.platform }}-extension
          path: dist/*.zip
          retention-days: 7

  release:
    if: github.ref_type == 'tag'
    needs: [check-version, build-cross, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Download the three extension zips
        uses: actions/download-artifact@v4
        with:
          pattern: vi-suite_HBC-*-extension
          path: dist
          merge-multiple: true

      - name: Name the zips after the version
        run: |
          cd dist
          for plat in macos-arm64 linux-x64 windows-x64; do
            mv "vi-suite_HBC-${plat}.zip" "vi-suite_HBC_v${VERSION}-${plat}.zip"
          done
          ls -lh

      - name: Create GitHub release
        # Notes: fixed part below + the list of merged PRs since the previous tag
        # (--generate-notes appends it). Edit the release afterwards on GitHub to add
        # a short "Fixes" section by hand.
        env:
          TESTED_BLENDER: ${{ inputs.blender_version || '5.3.0' }}
        run: |
          min="$(sed -n 's/^blender_version_min *= *"\(.*\)"/\1/p' blender_manifest.toml)"
          cat > notes.md <<EOF
          VI-Suite HBC ${GITHUB_REF_NAME} as a Blender extension, one zip per platform.

          ## Installation
          Blender → Edit → Preferences → Get Extensions → Install from Disk → select the zip for your platform. Do not unpack it first.

          **macOS / Safari:** Safari unpacks zip files automatically. Before downloading, switch off *Safari → Settings → General → "Open 'safe' files after downloading"*, or use another browser.

          ## Requirements
          - Blender ${min%.0} or newer
          - \`macos-arm64\`: macOS 14 (Sonoma) or newer on Apple Silicon (no Intel Macs)
          - \`windows-x64\`: Windows 10/11 x64
          - \`linux-x64\`: x86_64 with glibc 2.34 or newer (e.g. Ubuntu 22.04, 24.04, 26.04)

          ## Tests
          The three zips were built in this release run. The Linux zip was tested with Blender ${TESTED_BLENDER} (add-on install, imports, EnVi simulation with EnergyPlus and LiVi simulation with Radiance on example models) on Ubuntu 24.04 and 26.04 (built on 24.04). The macOS (Apple Silicon) and Windows zips were built on Ubuntu from the same sources but are not tested in the release run; they are tested separately with the "macOS test" and "Windows test" workflows.
          Older Blender versions down to the minimum version are tested with the "Blender versions" workflow.
          EOF
          sed -i 's/^          //' notes.md
          gh release create "${GITHUB_REF_NAME}" dist/*.zip \
            --title "VI-Suite HBC ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag
