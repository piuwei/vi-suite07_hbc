name: Checks

# Fast checks for every pull request (also for documentation-only changes).

on:
  pull_request:
    branches: [hbc_downstream]

jobs:
  line-endings:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Line endings unchanged (see docs/development.md, "Zeilenenden")
        run: python3 build_scripts/check_line_endings.py "origin/${{ github.base_ref }}" HEAD
