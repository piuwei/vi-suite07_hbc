name: Linux test

# Builds the VI-Suite HBC extension for linux-x64 on Ubuntu 24.04 (this zip is the
# release zip), then installs exactly this zip into Blender on Ubuntu 24.04 and 26.04
# and runs:
#   - tests/smoke_test.py      add-on enable, imports, EnergyPlus/Radiance start,
#                              separate Python (progress window) finds PySide6
#   - tests/envi_blend_test.py EnVi export + EnergyPlus run with tests/data/simple_cube.blend
#
# All wheels come from PyPI as listed in blender_manifest.toml; the Linux zip needs
# glibc >= 2.34 (PySide6 is manylinux_2_34).

# Same triggers as the macOS test: pushes to hbc_downstream, PRs into it,
# no runs for documentation-only changes, manual start.
on:
  push:
    branches: [hbc_downstream]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "Licenses/**"
  pull_request:
    branches: [hbc_downstream]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "Licenses/**"
  workflow_dispatch:
    inputs:
      blender_version:
        description: Blender version
        default: "5.3.0"
      upload_zip:
        description: Upload the built extension zip as artifact
        type: boolean
        default: false
  # used by release.yml
  workflow_call:
    inputs:
      blender_version:
        type: string
        default: "5.3.0"
      upload_zip:
        type: boolean
        default: false

jobs:
  build:
    name: linux-x64 build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BLENDER_VERSION: ${{ inputs.blender_version || '5.3.0' }}
      REPORTS: ${{ github.workspace }}/ci-reports

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/blender.tar.xz
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download Blender
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          series="${BLENDER_VERSION%.*}"
          curl -fL --retry 3 -o "$RUNNER_TEMP/blender.tar.xz" \
            "https://download.blender.org/release/Blender${series}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"

      - name: Install Blender
        run: |
          tar -xf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
          echo "BLENDER=$RUNNER_TEMP/blender-${BLENDER_VERSION}-linux-x64/blender" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/blender-${BLENDER_VERSION}-linux-x64/blender" --version
          mkdir -p "$REPORTS"

      - name: Cache wheels
        uses: actions/cache@v4
        with:
          path: |
            wheels
            ngsolve_wheels
          key: wheels-linux-x64-${{ hashFiles('blender_manifest.toml') }}

      - name: Prepare linux-x64 build (filter manifest, download wheels)
        run: python build_scripts/ci_prepare_platform.py --platform linux-x64 2>&1 | tee "$REPORTS/prepare.log"

      - name: Build extension
        run: |
          mkdir -p dist
          "$BLENDER" --command extension build --source-dir . \
            --output-filepath dist/vi-suite_HBC-linux-x64.zip 2>&1 | tee "$REPORTS/build.log"
          ls -lh dist

      - name: Hand the zip to the test jobs
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-build-${{ env.BLENDER_VERSION }}
          path: dist/vi-suite_HBC-linux-x64.zip
          retention-days: 1
          compression-level: 0

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-build-reports-${{ env.BLENDER_VERSION }}
          path: ci-reports
          retention-days: 14

      - name: Upload extension zip
        if: inputs.upload_zip
        uses: actions/upload-artifact@v4
        with:
          name: vi-suite_HBC-linux-x64-extension
          path: dist/*.zip
          retention-days: 7

  test:
    name: linux-x64 (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      BLENDER_VERSION: ${{ inputs.blender_version || '5.3.0' }}
      REPORTS: ${{ github.workspace }}/ci-reports

    steps:
      - uses: actions/checkout@v4

      - name: System packages for Blender and PySide6
        # Without libEGL the PySide6 import fails when the add-on is enabled,
        # and Blender then removes all extension wheels again.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libegl1 libgl1 libx11-6 libxi6 libxxf86vm1 libxfixes3 libxrender1 libxext6 \
            libsm6 libice6 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3
          mkdir -p "$REPORTS"
          { grep PRETTY_NAME /etc/os-release; ldd --version | head -1; } | tee "$REPORTS/system.txt"

      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/blender.tar.xz
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download Blender
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          series="${BLENDER_VERSION%.*}"
          curl -fL --retry 3 -o "$RUNNER_TEMP/blender.tar.xz" \
            "https://download.blender.org/release/Blender${series}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"

      - name: Install Blender
        run: |
          tar -xf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
          echo "BLENDER=$RUNNER_TEMP/blender-${BLENDER_VERSION}-linux-x64/blender" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/blender-${BLENDER_VERSION}-linux-x64/blender" --version

      - name: Get the zip built on Ubuntu 24.04
        uses: actions/download-artifact@v4
        with:
          name: linux-x64-build-${{ env.BLENDER_VERSION }}
          path: dist

      - name: Install extension
        run: |
          "$BLENDER" --command extension install-file --repo user_default --enable \
            dist/vi-suite_HBC-linux-x64.zip 2>&1 | tee "$REPORTS/install.log"

      - name: Smoke test
        run: |
          "$BLENDER" -b --python-exit-code 1 --python tests/smoke_test.py -- \
            --report "$REPORTS/smoke-report.json" 2>&1 | tee "$REPORTS/smoke.log"
          exit ${PIPESTATUS[0]}

      - name: EnVi test with simple_cube.blend
        if: success() || failure()
        run: |
          work="$RUNNER_TEMP/envi"
          mkdir -p "$work"
          cp tests/data/simple_cube.blend "$work/"
          set +e
          "$BLENDER" -b "$work/simple_cube.blend" --python-exit-code 1 --python tests/envi_blend_test.py -- \
            --report "$REPORTS/envi-report.json" 2>&1 | tee "$REPORTS/envi.log"
          rc=${PIPESTATUS[0]}
          mkdir -p "$REPORTS/envi-output"
          cp "$work"/simple_cube/in*.idf "$work"/simple_cube/*out.err "$REPORTS/envi-output/" 2>/dev/null
          exit $rc

      - name: Summary
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          rep = os.environ["REPORTS"]
          sysf = os.path.join(rep, "system.txt")
          if os.path.isfile(sysf):
              print("**System:** " + " / ".join(l.strip() for l in open(sysf)) + "\n")
          for name in ("smoke-report.json", "envi-report.json"):
              p = os.path.join(rep, name)
              print(f"### {name}\n")
              if not os.path.isfile(p):
                  print("not written\n"); continue
              print("| status | check | detail |\n|---|---|---|")
              for r in json.load(open(p)):
                  d = r["detail"].replace("|", "/").replace("\n", " ")[:300]
                  print(f"| {r['status']} | {r['check']} | {d} |")
              print()
          EOF

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-${{ matrix.os }}-reports-${{ env.BLENDER_VERSION }}
          path: ci-reports
          retention-days: 14
