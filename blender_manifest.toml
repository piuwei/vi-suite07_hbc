# Optional: Specify which platforms this extension supports
# If a wheel for a platform is missing, don't list it here
platforms = ["windows-x64", "macos-arm64", "linux-x64"]

# Optional: Permissions if your add-on accesses network, files, etc.
[permissions]
files = "Import/export simulation results and building geometry"
network = "Fetch weather data and simulation results"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "/.git*",
  "/*.zip",
  "/*.sh",
  "/.vscode/",
  "/assets/",
  "/build_scripts/",
  "/tests/",
  "/docs/",
  "/dist/",
  "/.github/",
  "/vi07.pdf",
]
